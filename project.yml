name: Rapporteur
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    # Support policy: the current iOS and the one before.
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # xcodegen does not set this; without it Color.accentColor is system blue.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO
targets:
  Rapporteur:
    type: application
    platform: iOS
    sources:
      - Rapporteur
    info:
      path: Rapporteur/Info.plist
      properties:
        CFBundleDisplayName: Rapporteur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krisnorthfield.rapporteur
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  RapporteurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RapporteurTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rapporteur
schemes:
  Rapporteur:
    build:
      targets:
        Rapporteur: all
        RapporteurTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RapporteurTests
